<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova — swipe the best of the internet</title>
<meta name="description" content="A marketplace you swipe instead of scroll. Discover from independent Pakistani sellers, wishlist what you love, and check out with cash on delivery.">
<meta name="theme-color" content="#14614a">
<link rel="canonical" href="https://amdapex55-commits.github.io/nova-marketplace/">

<!-- The share card. Instagram, Facebook and WhatsApp are the entire acquisition
     plan, and a link with no preview renders there as a bare grey box — which,
     for a shop asking a stranger for their home address, reads as a scam. The
     og:image URL must be absolute; relative ones are silently dropped. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nova Marketplace">
<meta property="og:title" content="Nova — swipe the best of the internet">
<meta property="og:description" content="Independent Pakistani sellers, one card at a time. Swipe right to save, check out with cash on delivery. No account needed.">
<meta property="og:url" content="https://amdapex55-commits.github.io/nova-marketplace/">
<meta property="og:image" content="https://amdapex55-commits.github.io/nova-marketplace/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nova — a fanned deck of three cards on a deep green ground.">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/motion.css">
<script src="config.js"></script>
</head>
<body>

<!-- The splash is in the HTML, not built by JavaScript, so it paints on the
     first frame instead of after the module graph loads. The catalogue is
     fetched underneath it; the 2-3 seconds are real work, not a delay. -->
<div class="splash" id="splash" role="status" aria-live="polite">
  <div class="splash-in">
    <!-- The dot that orbits here is the same mark that bursts on a save, flies
         into the bag, draws the tick on an order and rings a photo while it
         uploads. One idea doing every job. -->
    <div class="orbit" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring two"></span>
      <span class="sat"><i></i></span>
      <span class="sat slow"><i></i></span>
      <span class="core"><b></b></span>
    </div>
    <div class="mark">nova<em>.</em></div>
    <p class="tag">Swipe the best of the internet</p>
  </div>
</div>

<div id="app" aria-busy="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
  /* Registered after load so it never competes with the first paint. Failure is
     silent on purpose: the app works identically without it, and an install
     error on an old browser is not something a shopper can act on. */
  /* Not on localhost. A worker that caches the shell while you are editing it
     serves yesterday's CSS and makes every change look like it did nothing. */
  const onLocalhost = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  if ('serviceWorker' in navigator && !onLocalhost) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  } else if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
  }
</script>
</body>
</html>
